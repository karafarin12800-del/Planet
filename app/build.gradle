plugins {
    id "com.android.application"
}

android {
    namespace "com.planet.live"
    compileSdk 36

    defaultConfig {
        applicationId "com.planet.live"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (project.hasProperty("UPLOAD_STORE_FILE")) {
                storeFile file(project.property("UPLOAD_STORE_FILE"))
                storePassword project.property("UPLOAD_STORE_PASSWORD")
                keyAlias project.property("UPLOAD_KEY_ALIAS")
                keyPassword project.property("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            if (project.hasProperty("UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
}
