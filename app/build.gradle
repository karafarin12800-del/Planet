plugins {
    id "com.android.application"
}

def buildConfigString = { value ->
    '"' + value.toString()
            .replace("\\", "\\\\")
            .replace('"', '\\"')
            .replace("\r", "")
            .replace("\n", "") + '"'
}
def googleWebClientId = providers.gradleProperty("PLANET_GOOGLE_WEB_CLIENT_ID").orElse("").get()
def bazaarRsaPublicKey = providers.gradleProperty("PLANET_BAZAAR_RSA_PUBLIC_KEY").orElse("").get()

android {
    namespace "com.planet.live"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.planet.live"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.0.4"
        buildConfigField "String", "PLANET_GOOGLE_WEB_CLIENT_ID", buildConfigString(googleWebClientId)
        buildConfigField "String", "PLANET_BAZAAR_RSA_PUBLIC_KEY", buildConfigString(bazaarRsaPublicKey)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (project.hasProperty("UPLOAD_STORE_FILE")) {
                storeFile file(project.property("UPLOAD_STORE_FILE"))
                storePassword project.property("UPLOAD_STORE_PASSWORD")
                keyAlias project.property("UPLOAD_KEY_ALIAS")
                keyPassword project.property("UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            if (project.hasProperty("UPLOAD_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.activity:activity:1.13.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
}
