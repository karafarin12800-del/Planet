name: Build PLANET Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'planet-localization.js'
      - 'planet-localization.js'
      - 'genome-evidence.html'
      - 'evolution-engine.js'
      - 'procedural-organism-3d.js'
      - 'planet-image-generation.js'
      - 'services/image-generation-worker/**'
      - 'tests/**'
      - 'offline-ai.js'
      - 'offline-evolution.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'privacy.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'genome-evidence.html'
      - 'index.html'
      - 'evolution-engine.js'
      - 'procedural-organism-3d.js'
      - 'planet-image-generation.js'
      - 'services/image-generation-worker/**'
      - 'offline-ai.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'privacy.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build installable APK and Play bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle the current web simulation into the Android app
        run: |
          mkdir -p app/src/main/assets
          cp index.html planet-localization.js evolution-engine.js procedural-organism-3d.js planet-image-generation.js offline-ai.js offline-evolution.js manifest.webmanifest sw.js icon.svg privacy.html app/src/main/assets/
          cp genome-evidence.html app/src/main/assets/

      - name: Validate offline evolution lifecycle controller syntax
        run: node --check offline-evolution.js

      - name: Bundle high-resolution Earth day map for mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/planet-texture-venv
          /tmp/planet-texture-venv/bin/python -m pip install --quiet --disable-pip-version-check Pillow
          SOURCE="/tmp/planet-earth-daymap-8k.jpg"
          # Some CDN responses can be HTML with HTTP 200. Validate the actual image before using it.
          curl --fail --location --retry 2 --retry-all-errors --retry-delay 2 \
            "https://cdn.solarsystemscope.com/textures/download/8k_earth_daymap.jpg" \
            --output "$SOURCE" || true
          if ! /tmp/planet-texture-venv/bin/python - "$SOURCE" <<'PY'
          import sys
          from PIL import Image
          try:
              with Image.open(sys.argv[1]) as image:
                  ok = image.format == "JPEG" and image.size == (8192, 4096)
          except Exception:
              ok = False
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo "Primary texture URL did not return a valid 8K JPEG; using the Wikimedia Commons mirror."
            curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
              "https://upload.wikimedia.org/wikipedia/commons/0/04/Solarsystemscope_texture_8k_earth_daymap.jpg" \
              --output "$SOURCE"
          fi
          /tmp/planet-texture-venv/bin/python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("/tmp/planet-earth-daymap-8k.jpg")
          target = Path("app/src/main/assets/earth-daymap-4k.jpg")
          with Image.open(source) as image:
              if image.format != "JPEG" or image.size != (8192, 4096):
                  raise SystemExit(f"Unexpected source texture: format={image.format}, size={image.size}")
              image.convert("RGB").resize((4096, 2048), Image.Resampling.LANCZOS).save(
                  target, format="JPEG", quality=91, optimize=True, progressive=True
              )
          with Image.open(target) as image:
              if image.size != (4096, 2048):
                  raise SystemExit(f"Earth texture resize failed: {image.size}")
          if target.stat().st_size < 100_000:
              raise SystemExit("Earth texture output is unexpectedly small.")
          print(f"Bundled {target} with dimensions 4096x2048 ({target.stat().st_size:,} bytes).")
          PY

      - name: Validate full-genome lab JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script id="gp-genome-lab-script">(.*?)</script>', source, re.S | re.I)
          if not match:
              raise SystemExit("Full-genome lab script was not found in index.html")
          pathlib.Path("/tmp/planet-genome-lab.js").write_text(match.group(1), encoding="utf-8")
          print("Extracted full-genome lab script for Node.js syntax validation.")
          PY
          node --check /tmp/planet-genome-lab.js


      - name: Validate standalone genome evidence page and run tests
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("genome-evidence.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', source, re.S | re.I)
          scripts = [body for attrs, body in matches if not re.search(r'\bsrc\s*=', attrs, re.I)]
          if not scripts:
              raise SystemExit("No inline analysis JavaScript found in genome-evidence.html")
          for i, body in enumerate(scripts):
              pathlib.Path(f"/tmp/planet-genome-evidence-{i}.js").write_text(body, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks for syntax validation.")
          PY
          for script in /tmp/planet-genome-evidence-*.js; do node --check "$script"; done
          node tests/genome-evidence.test.cjs
          node tests/ui-regression.test.cjs

      - name: Validate genome-to-organism evolution engine
        run: |
          node --check evolution-engine.js
          node tests/evolution-engine.test.cjs
          node --check procedural-organism-3d.js
          npm install --no-save --no-package-lock gltf-validator
          node tests/procedural-organism-3d.test.cjs

      - name: Validate genome-driven AI image generation pipeline
        run: |
          node --check planet-image-generation.js
          node --check --input-type=module < services/image-generation-worker/index.js
          node tests/image-generation-contract.test.cjs

      - name: Validate shared localization engine and translations
        run: |
          node --check planet-localization.js
          node tests/localization.test.cjs

      - name: Validate all inline JavaScript in app HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', source, re.S | re.I)
          scripts = [body for attrs, body in matches if not re.search(r'\bsrc\s*=', attrs, re.I)]
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for i, body in enumerate(scripts):
              pathlib.Path(f"/tmp/planet-inline-{i}.js").write_text(body, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks.")
          PY
          for script in /tmp/planet-inline-*.js; do node --check "$script"; done

      - name: Validate offline intelligence engine
        run: |
          node --check offline-ai.js
          node - <<'NODE'
          const ai = require('./offline-ai.js');
          const result = ai.selfTest();
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          NODE

      - name: Build installable APK and Google Play App Bundle
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" && -n "$PLAY_UPLOAD_STORE_PASSWORD" && -n "$PLAY_UPLOAD_KEY_ALIAS" && -n "$PLAY_UPLOAD_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/planet-upload.jks"
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease \
              -PUPLOAD_STORE_FILE="$KEYSTORE_PATH" \
              -PUPLOAD_STORE_PASSWORD="$PLAY_UPLOAD_STORE_PASSWORD" \
              -PUPLOAD_KEY_ALIAS="$PLAY_UPLOAD_KEY_ALIAS" \
              -PUPLOAD_KEY_PASSWORD="$PLAY_UPLOAD_KEY_PASSWORD"
            cp app/build/outputs/bundle/release/app-release.aab dist/PLANET-PlayBundle-SIGNED.aab
            cp app/build/outputs/apk/release/app-release.apk dist/PLANET-Android-Release-SIGNED.apk
          else
            gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab dist/PLANET-PlayBundle-UNSIGNED-NEEDS-SIGNING.aab
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/PLANET-Android-Release-UNSIGNED.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/PLANET-Android-Install.apk
          ls -lh dist

      - name: Upload downloadable Android files
        uses: actions/upload-artifact@v4
        with:
          name: PLANET-Android-Package
          path: dist/*
          if-no-files-found: error
          retention-days: 30
