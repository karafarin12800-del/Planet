name: Build PLANET Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'evolution-engine.js'
      - 'tests/**'
      - 'offline-ai.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'privacy.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'evolution-engine.js'
      - 'offline-ai.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'privacy.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build installable APK and Play bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Bundle the current web simulation into the Android app
        run: |
          mkdir -p app/src/main/assets
          cp index.html evolution-engine.js offline-ai.js manifest.webmanifest sw.js icon.svg privacy.html app/src/main/assets/

      - name: Validate full-genome lab JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script id="gp-genome-lab-script">(.*?)</script>', source, re.S | re.I)
          if not match:
              raise SystemExit("Full-genome lab script was not found in index.html")
          pathlib.Path("/tmp/planet-genome-lab.js").write_text(match.group(1), encoding="utf-8")
          print("Extracted full-genome lab script for Node.js syntax validation.")
          PY
          node --check /tmp/planet-genome-lab.js

      - name: Validate genome-to-organism evolution engine
        run: |
          node --check evolution-engine.js
          node tests/evolution-engine.test.cjs

      - name: Validate all inline JavaScript in app HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          source = pathlib.Path("index.html").read_text(encoding="utf-8")
          matches = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', source, re.S | re.I)
          scripts = [body for attrs, body in matches if not re.search(r'\bsrc\s*=', attrs, re.I)]
          if not scripts:
              raise SystemExit("No inline scripts found in index.html")
          for i, body in enumerate(scripts):
              pathlib.Path(f"/tmp/planet-inline-{i}.js").write_text(body, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline JavaScript blocks.")
          PY
          for script in /tmp/planet-inline-*.js; do node --check "$script"; done

      - name: Validate offline intelligence engine
        run: |
          node --check offline-ai.js
          node - <<'NODE'
          const ai = require('./offline-ai.js');
          const result = ai.selfTest();
          console.log(JSON.stringify(result, null, 2));
          if (!result.ok) process.exit(1);
          NODE

      - name: Build installable APK and Google Play App Bundle
        shell: bash
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" && -n "$PLAY_UPLOAD_STORE_PASSWORD" && -n "$PLAY_UPLOAD_KEY_ALIAS" && -n "$PLAY_UPLOAD_KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/planet-upload.jks"
            printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease \
              -PUPLOAD_STORE_FILE="$KEYSTORE_PATH" \
              -PUPLOAD_STORE_PASSWORD="$PLAY_UPLOAD_STORE_PASSWORD" \
              -PUPLOAD_KEY_ALIAS="$PLAY_UPLOAD_KEY_ALIAS" \
              -PUPLOAD_KEY_PASSWORD="$PLAY_UPLOAD_KEY_PASSWORD"
            cp app/build/outputs/bundle/release/app-release.aab dist/PLANET-PlayBundle-SIGNED.aab
            cp app/build/outputs/apk/release/app-release.apk dist/PLANET-Android-Release-SIGNED.apk
          else
            gradle --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease
            cp app/build/outputs/bundle/release/app-release.aab dist/PLANET-PlayBundle-UNSIGNED-NEEDS-SIGNING.aab
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/PLANET-Android-Release-UNSIGNED.apk
          fi
          cp app/build/outputs/apk/debug/app-debug.apk dist/PLANET-Android-Install.apk
          ls -lh dist

      - name: Upload downloadable Android files
        uses: actions/upload-artifact@v4
        with:
          name: PLANET-Android-Package
          path: dist/*
          if-no-files-found: error
          retention-days: 30
